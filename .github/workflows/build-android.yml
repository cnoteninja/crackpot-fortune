name: Build Android (debug APK)

# Builds an installable debug APK on GitHub's machines — no Android Studio
# or Play Store account needed. Download the APK from the run's Artifacts
# and install it directly on a phone (allow "install unknown apps").
# The native android/ project is generated fresh in this workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "resources/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx cap add android

      - name: Generate icons and splash screens
        run: |
          if [ -f resources/icon.png ]; then
            npx capacitor-assets generate --android
          else
            echo "resources/icon.png not present yet — using default icons"
          fi

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crackpot-fortune-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
